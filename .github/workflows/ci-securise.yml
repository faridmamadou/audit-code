# Exemple de workflow GitHub Actions sécurisé — cours "Auditer son code avant de pousser"
# Corrige les 5 alertes zizmor du workflow vulnérable (voir ci-vulnerable-exemple.yml).
# Vérifié avec zizmor 1.30.1 : "No findings to report."

name: ci

on:
  pull_request:        # et non pull_request_target

permissions: {}        # aucun droit par défaut

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # le strict nécessaire

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false   # évite de laisser le token dans .git/config

      - name: Afficher le titre de la PR
        run: echo "Titre - ${PR_TITLE}"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}  # passé en variable, pas interpolé
